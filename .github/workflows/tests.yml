name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-tested.txt -r requirements-market.txt
      - run: python -m unittest discover -s tests -v
        env:
          GSHEETS_AUTO_SYNC: 'False'
      - run: python -m unittest discover -s local_assistant -p "test_*.py" -v
  market-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: illoura_market_test
          POSTGRES_USER: illoura_market
          # Ephemeral CI service only; never use this value outside the test runner.
          POSTGRES_PASSWORD: ci-disposable-database
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U illoura_market -d illoura_market_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-market.txt
      - run: python -m unittest discover -s tests -p test_market_intelligence.py -v
        env:
          ILLOURA_MARKET_TEST_DATABASE_URL: postgresql+psycopg://illoura_market:ci-disposable-database@127.0.0.1:55432/illoura_market_test
