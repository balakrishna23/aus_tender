name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m unittest discover -s tests -v
        env:
          GSHEETS_AUTO_SYNC: 'False'
      - run: python -m unittest discover -s local_assistant -p "test_*.py" -v
