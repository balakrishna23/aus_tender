# Illoura (installed by illoura_aws.py harden-os as /etc/needrestart/conf.d/illoura.conf).
# After package upgrades Ubuntu's needrestart restarts affected services automatically.
# Never restart the scheduled Illoura jobs: a restart would kill the daily brief between
# its 06:15 start and the 08:15 Sydney send and start the whole run again.
# The API service may restart (systemd restarts it within seconds anyway).
$nrconf{override_rc}{qr(^illoura-(daily-brief|cloud-collect|cloud-health)\.service$)} = 0;
