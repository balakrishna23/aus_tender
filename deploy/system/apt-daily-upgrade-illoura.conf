# Illoura (installed by illoura_aws.py harden-os as
# /etc/systemd/system/apt-daily-upgrade.timer.d/illoura.conf).
# Ubuntu installs security updates at a random time between 06:00 and 07:00, inside the
# daily brief's 06:15-08:15 Sydney window. Run them at 03:30-04:00 Sydney instead.
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:30 Australia/Sydney
RandomizedDelaySec=30m
